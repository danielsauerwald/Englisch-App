<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer glowing pulse ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- Steering Wheel & Soundwaves Motif -->
  <!-- Outer wheel rim -->
  <circle cx="256" cy="230" r="120" fill="none" stroke="url(#accent)" stroke-width="18" filter="url(#glow)"/>
  <!-- Inner hub -->
  <circle cx="256" cy="230" r="42" fill="#0f172a" stroke="url(#accent)" stroke-width="12"/>

  <!-- Wheel spokes -->
  <path d="M 144 230 L 214 230 M 298 230 L 368 230 M 256 272 L 256 342" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

  <!-- Center Voice Soundwave lines inside hub -->
  <line x1="240" y1="230" x2="240" y2="230" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="248" y1="220" x2="248" y2="240" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="212" x2="256" y2="248" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="264" y1="220" x2="264" y2="240" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="272" y1="230" x2="272" y2="230" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Audio Wave Radiations on sides -->
  <path d="M 90 200 A 180 180 0 0 0 90 260" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M 60 180 A 220 220 0 0 0 60 280" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  
  <path d="M 422 200 A 180 180 0 0 1 422 260" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M 452 180 A 220 220 0 0 1 452 280" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- Perspective Highway road lines at bottom -->
  <polygon points="252,380 260,380 290,460 222,460" fill="url(#road)"/>
  <line x1="256" y1="390" x2="256" y2="415" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="430" x2="256" y2="455" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
</svg>
