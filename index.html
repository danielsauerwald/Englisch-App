    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Suppress benign Vite WebSocket / HMR disconnect events in Cloud Run preview iframe
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
            event.message.includes('vite') ||
            event.message.includes('ws:'))
        ) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
            String(event.reason).includes('vite'))
        ) {
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 select-none overflow-x-hidden">

  </body>
